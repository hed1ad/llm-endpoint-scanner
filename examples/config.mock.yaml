# Example config for scanning the local mock endpoint (examples/mock_server.py).
#
# Usage:
#   python examples/mock_server.py &
#   llm-scan scan examples/config.mock.yaml

endpoint:
  url: http://127.0.0.1:8000/chat
  method: POST
  headers:
    Content-Type: application/json

  request_template:
    model: mock-bot
    messages:
      - role: system
        content: "You are the Acme support bot. Only answer product questions."
      - role: user
        content: "{{INPUT}}"

  response_path: "choices.0.message.content"

limits:
  timeout_seconds: 5
  max_requests_per_second: 10
  max_probe_length: 8000

report:
  json_path: report.mock.json
