<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2a4a"/>
      <stop offset="1" stop-color="#0d1424"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4ade80" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#4ade80" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="26" fill="none" stroke="#2f4a7a" stroke-width="2"/>

  <!-- radar rings -->
  <circle cx="64" cy="64" r="40" fill="none" stroke="#3b5b8f" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="28" fill="none" stroke="#3b5b8f" stroke-width="1.5"/>
  <circle cx="64" cy="64" r="16" fill="none" stroke="#3b5b8f" stroke-width="1.5"/>
  <line x1="64" y1="24" x2="64" y2="104" stroke="#3b5b8f" stroke-width="1"/>
  <line x1="24" y1="64" x2="104" y2="64" stroke="#3b5b8f" stroke-width="1"/>

  <!-- radar sweep -->
  <path d="M64 64 L64 24 A40 40 0 0 1 98 44 Z" fill="url(#sweep)"/>
  <line x1="64" y1="64" x2="98" y2="44" stroke="#4ade80" stroke-width="2.5" stroke-linecap="round"/>

  <!-- center: LLM endpoint -->
  <circle cx="64" cy="64" r="6" fill="#4ade80"/>

  <!-- detected threats -->
  <circle cx="84" cy="80" r="4" fill="#f87171"/>
  <circle cx="84" cy="80" r="8" fill="none" stroke="#f87171" stroke-width="1.5" stroke-opacity="0.7"/>
  <circle cx="48" cy="44" r="3.5" fill="#fbbf24"/>
  <circle cx="48" cy="44" r="7" fill="none" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.7"/>
</svg>
